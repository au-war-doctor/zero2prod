variables:
  CD_REGISTRY_IMAGE: "auwardoctor/email-newsletter"
  CD_REGISTRY_NAME: "index.docker.io"

stages:
  - compile
  - deploy
  - production

default:
  image: rust:slim 


test:
  stage: compile
  before_script:
    - apt update -qq && apt install -y -qq pkg-config && apt install -y -qq openssl
    - apt install -y -qq libssl-dev
  script:
    - echo "Beginning test. . ."
    - cargo test
  tags:
    - hpt730


build_release:
  stage: compile
  before_script:
    - apt update -qq && apt install -y -qq pkg-config && apt install -y -qq openssl
    - apt install -y -qq libssl-dev
  script: 
    - echo "Beginning build. . ."
    - cargo build --release
  tags:
    - hpt730
  artifacts:
    paths:
      - target/release/zero2prod


build_image:
  stage: deploy
  image: docker
  needs: [build_release]
  script:
    - docker pull $CD_REGISTRY_IMAGE:latest || true
    - docker build --tag $CD_REGISTRY_IMAGE:latest --file Dockerfile .
    - docker push $CD_REGISTRY_IMAGE:latest
  tags:
    - hpt730

test_production:
  stage: production
  image: 
    name: grafana/k6:0.54.0
    entrypoint: [""]
  script:
    - echo "executing local k6 test for production environment . . ."
    - k6 run ./load_tests/get.js
  tags:
    - hpt730




